schema_version: 1
task:
  type: binary_classification

data:
  train_path: data/train.csv
  test_path: data/test.csv
  target_col: target
  id_col: id
  group_col: customer_id

features:
  numeric:
    - feature_1
    - feature_2
  categorical:
    - region
  derived:
    numeric: []
    categorical: []
  text: null
  ignore_text: true

validation:
  strategy: stratified_group_kfold
  protocol_name: grouped_classification_v1
  split_path: artifacts/splits/grouped_classification_v1.json
  n_splits: 3
  shuffle: true
  random_state: 42

model:
  type: logistic_regression
  params:
    max_iter: 200

evaluation:
  metrics:
    - accuracy
    - f1_macro
    - roc_auc
  primary_metric: roc_auc

tracking:
  backend: local
  experiment_name: expctl_examples
  run_name: exp_103_grouped_classification
  tags:
    example: grouped_classification

output:
  dir: artifacts/experiments/exp_103_grouped_classification
  fold_metrics_file: fold_metrics.csv
  oof_predictions_file: oof_predictions.csv
  summary_file: summary.yaml
  registry_path: reports/experiment_registry.csv
