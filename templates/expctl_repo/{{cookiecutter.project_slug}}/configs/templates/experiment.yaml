data:
  train_path: "data/processed/train.csv"
  target_col: "target"
  id_col: "{{cookiecutter.default_id_col}}"

features:
  numeric: []
  categorical: []
  derived:
    numeric: []
    categorical: []
  text: "text"
  ignore_text: true

validation:
  split_path: "artifacts/splits/stratified_kfold_v1_seed42.json"
  protocol_name: "stratified_kfold_v1"

model:
  type: "logistic_regression"
  params: {}

evaluation:
  metrics: ["accuracy"]

output:
  dir: "artifacts/experiments/exp_001_baseline"
  fold_metrics_file: "fold_metrics.csv"
  oof_predictions_file: "oof_predictions.csv"
  summary_file: "cv_summary.json"
